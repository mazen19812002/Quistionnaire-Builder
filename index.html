                                                <span className="text-lg">📊</span> أعمدة / مقاييس المحور (Likert Scales)
                                            </h3>
                                            <button
                                                onClick={() => addScale(domain.id)}
                                                className="btn-shiny btn-shiny-green px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm group cursor-pointer"
                                            >
                                                <span className="text-sm drop-shadow-sm group-hover:scale-110 transition-transform">➕</span> عمود جديد
                                            </button>
                                        </div>
                                        
                                        <div className="flex flex-wrap gap-1.5">
                                            {domain.scales.map((scale, index) => {
                                                const isDraggedOver = draggedOverScale && draggedOverScale.domainId === domain.id && draggedOverScale.index === index;
                                                return (
                                                    <div
                                                        key={scale.id}
                                                        draggable
                                                        onDragStart={(e) => handleScaleDragStart(e, domain.id, index)}
                                                        onDragOver={(e) => handleScaleDragOver(e, domain.id, index)}
                                                        onDrop={(e) => handleScaleDrop(e, domain.id, index)}
                                                        onDragEnd={handleScaleDragEnd}
                                                        className={`flex flex-col sm:flex-row items-center gap-1 bg-white border p-1 rounded-lg shadow-sm cursor-move transition-all hover:shadow-md
                                                            ${isDraggedOver ? 'border-dashed border-2 border-blue-500 bg-blue-50 scale-105' : 'border-gray-300'}
                                                        `}
                                                        title="اسحب لتغيير الترتيب داخل المحور"
                                                    >
                                                        <i className="fas fa-grip-vertical text-gray-400 px-1 text-sm hover:text-blue-500"></i>
                                                        <input
                                                            type="text"
                                                            value={scale.name}
                                                            onChange={(e) => updateScaleName(domain.id, scale.id, e.target.value)}
                                                            className="p-1 border border-gray-200 rounded text-xs focus:outline-none focus:border-blue-500 w-20 text-center font-bold bg-gray-50"
                                                            placeholder="اسم العمود"
                                                        />
                                                        <select
                                                            value={scale.type || 'neutral'}
                                                            onChange={(e) => updateScaleType(domain.id, scale.id, e.target.value)}
                                                            className={`p-1 border border-gray-200 rounded text-xs focus:outline-none font-bold cursor-pointer
                                                                ${scale.type === 'positive' ? 'text-green-700 bg-green-50' : 
                                                                    scale.type === 'negative' ? 'text-red-700 bg-red-50' : 
                                                                        'text-gray-700 bg-gray-50'}`}
                                                        >
                                                            <option value="positive">إيجابي (+)</option>
                                                            <option value="neutral">محايد (0)</option>
                                                            <option value="negative">سلبي (-)</option>
                                                        </select>
                                                        {domain.scales.length > 1 && (
                                                            <button onClick={() => removeScale(domain.id, scale.id)} className="text-red-400 hover:text-red-600 px-1 text-base hover:scale-110 transition-transform cursor-pointer">
                                                                <i className="fas fa-times-circle"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    
                                    <div className="w-full overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
                                        <div className="min-w-[1040px] md:min-w-[1300px]">
                                            <div className="flex gap-1.5 bg-slate-100 p-1.5 md:p-2 rounded-t-xl font-bold text-gray-700 border-b border-gray-300 items-center">
                                                <div className="w-8"></div>
                                                <div className="flex-1 px-1 text-xs md:text-sm text-blue-900 drop-shadow-sm">البنود (Sub-items)</div>
                                                {domain.scales.map(scale => (
                                                    <div key={scale.id} className={`w-24 text-center px-1 text-xs flex flex-col items-center justify-center
                                                        ${scale.type === 'positive' ? 'text-green-700' : 
                                                            scale.type === 'negative' ? 'text-red-700' : 
                                                                'text-gray-600'}`}
                                                    >
                                                        <span className="font-bold truncate w-full drop-shadow-sm">{scale.name}</span>
                                                        {scale.type === 'positive' && <i className="fas fa-plus text-[10px] mt-0.5"></i>}
                                                        {scale.type === 'negative' && <i className="fas fa-minus text-[10px] mt-0.5"></i>}
                                                        {scale.type === 'neutral' && <i className="fas fa-circle text-[8px] mt-0.5 opacity-50"></i>}
                                                    </div>
                                                ))}
                                                <div className="w-20 text-center font-bold text-xs text-blue-800 drop-shadow-sm">إجمالي الصف</div>
                                                <div className="w-20 text-center font-bold text-xs text-green-700 drop-shadow-sm">إيجابيات</div>
                                                <div className="w-12 text-center"></div>
                                            </div>
                                            
                                            <div className={`${domain.items.length > 0 ? '' : 'rounded-b-xl'} pb-1 bg-gray-50 space-y-1 p-1.5`}>
                                                {domain.items.map((item, iIndex) => {
                                                    const isDraggedOver = draggedOverItem && draggedOverItem.domainId === domain.id && draggedOverItem.itemIndex === iIndex;
                                                    const rowTotal = getItemRowTotal(item.values, domain.scales);
                                                    const posTotal = getPositivesTotal(item.values, domain.scales);
                                                    const hasValues = domain.scales.some(s => item.values[s.id] !== '' && Number(item.values[s.id]) > 0);
                                                    
                                                    const isRowValid = item.isMultiSelect ? true : Math.abs(rowTotal - 100) < 0.1;
                                                    const needsRedBorder = !item.isMultiSelect && hasValues && !isRowValid;
                                                    
                                                    return (
                                                        <div 
                                                            key={item.id}
                                                            draggable
                                                            onDragStart={(e) => handleDragStart(e, domain.id, iIndex)}
                                                            onDragOver={(e) => handleDragOver(e, domain.id, iIndex)}
                                                            onDrop={(e) => handleDrop(e, domain.id, iIndex)}
                                                            onDragEnd={handleDragEnd}
                                                            className={`flex items-center gap-1.5 p-1.5 md:p-2 rounded-lg bg-white shadow-sm transition-all cursor-move hover:shadow-md
                                                                ${isDraggedOver ? 'border-dashed border-2 border-blue-400 bg-blue-50 scale-[1.01]' : ''}
                                                                ${needsRedBorder ? 'border-2 border-red-500 ring-2 ring-red-100' : 'border border-gray-200'}
                                                                ${item.isMultiSelect ? 'border-r-4 border-r-purple-500' : ''}
                                                            `}
                                                        >
                                                            <div className="w-8 flex justify-center text-gray-400 hover:text-blue-600 transition-colors">
                                                                <i className="fas fa-grip-vertical text-xl"></i>
                                                            </div>
                                                            
                                                            <div className="flex-1 px-1 flex flex-col">
                                                                <input
                                                                    type="text"
                                                                    value={item.text}
                                                                    onChange={(e) => updateItemText(domain.id, item.id, e.target.value)}
                                                                    onPaste={(e) => handleColumnPaste(e, domain.id, iIndex, 'text')}
                                                                    className="w-full p-2 border border-gray-300 rounded-lg text-sm md:text-base font-bold focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200 bg-gray-50 hover:bg-white transition-colors shadow-inner"
                                                                    placeholder="أدخل نص البند..."
                                                                />
                                                                <label className="flex items-center gap-1 text-[11px] text-gray-500 mt-1 cursor-pointer font-bold w-max">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        checked={!!item.isMultiSelect} 
                                                                        onChange={(e) => updateItemField(domain.id, item.id, 'isMultiSelect', e.target.checked)}
                                                                        className="accent-purple-600"
                                                                    />
                                                                    سؤال متعدد الاختيارات (يسمح بأكثر من 100%)
                                                                </label>
                                                            </div>
                                                            
                                                            {domain.scales.map(scale => (
                                                                <div key={`cell-${scale.id}`} className="w-24 px-1 flex items-center justify-center">
                                                                    <div className={`flex w-full items-stretch rounded-lg overflow-hidden border shadow-inner transition-all
                                                                        ${scale.type === 'positive' ? 'border-green-200 focus-within:border-green-500 focus-within:ring-1 focus-within:ring-green-200' : 
                                                                        scale.type === 'negative' ? 'border-red-200 focus-within:border-red-500 focus-within:ring-1 focus-within:ring-red-200' : 
                                                                        'border-gray-300 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-200'}`}
                                                                    >
                                                                        <button 
                                                                            onClick={() => updateItemValue(domain.id, item.id, scale.id, Math.max(0, (Number(item.values[scale.id]) || 0) - 1))}
                                                                            className={`px-2 flex items-center justify-center transition-colors border-l cursor-pointer
                                                                                ${scale.type === 'positive' ? 'bg-green-100 hover:bg-green-200 text-green-800' : 
                                                                                scale.type === 'negative' ? 'bg-red-100 hover:bg-red-200 text-red-800' : 
                                                                                'bg-gray-100 hover:bg-gray-200 text-gray-800'}`}
                                                                        >
                                                                            <i className="fas fa-minus text-[13px]"></i>
                                                                        </button>
                                                                        <input
                                                                            type="number"
                                                                            value={item.values[scale.id] !== undefined ? item.values[scale.id] : ''}
                                                                            onChange={(e) => updateItemValue(domain.id, item.id, scale.id, e.target.value)}
                                                                            onPaste={(e) => handleColumnPaste(e, domain.id, iIndex, 'value', scale.id)}
                                                                            className={`w-full py-1.5 text-center text-sm focus:outline-none font-bold transition-colors flex-1
                                                                                ${scale.type === 'positive' ? 'bg-green-50 text-green-800' : 
                                                                                scale.type === 'negative' ? 'bg-red-50 text-red-800' : 
                                                                                'bg-white text-gray-800'}`}
                                                                        />
                                                                        <button 
                                                                            onClick={() => updateItemValue(domain.id, item.id, scale.id, Math.min(100, (Number(item.values[scale.id]) || 0) + 1))}
                                                                            className={`px-2 flex items-center justify-center transition-colors border-r cursor-pointer
                                                                                ${scale.type === 'positive' ? 'bg-green-100 hover:bg-green-200 text-green-800' : 
                                                                                scale.type === 'negative' ? 'bg-red-100 hover:bg-red-200 text-red-800' : 
                                                                                'bg-gray-100 hover:bg-gray-200 text-gray-800'}`}
                                                                        >
                                                                            <i className="fas fa-plus text-[13px]"></i>
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                            
                                                            <div className="w-20 flex items-center justify-center">
                                                                <div className={`w-full text-center font-bold text-sm px-1 py-1.5 rounded-lg shadow-sm transition-colors ${item.isMultiSelect ? 'bg-purple-100 text-purple-800 border border-purple-200' : (isRowValid ? 'bg-blue-100 text-blue-800 border border-blue-200' : 'bg-red-500 text-white shadow-red-300 animate-pulse border border-red-600')}`}
                                                                     title={item.isMultiSelect ? "المجموع لا يشترط أن يكون 100%" : ""}
                                                                >
                                                                    {rowTotal.toFixed(1)}%
                                                                </div>
                                                            </div>
                                                            
                                                            <div className="w-20 flex items-center justify-center">
                                                                <div className={`w-full text-center font-bold text-sm px-1 py-1.5 rounded-lg shadow-sm transition-colors bg-green-100 text-green-800 border border-green-200`}>
                                                                    {posTotal.toFixed(1)}%
                                                                </div>
                                                            </div>
                                                            
                                                            <div className="w-12 flex justify-center">
                                                                <button
                                                                    onClick={() => removeItem(domain.id, item.id)}
                                                                    className="text-red-500 hover:text-white bg-red-50 hover:bg-red-500 w-8 h-8 rounded-lg transition-all flex items-center justify-center hover:scale-110 shadow-sm border border-red-100 hover:shadow-red-300 group cursor-pointer"
                                                                    title="حذف البند"
                                                                >
                                                                    <span className="text-sm group-hover:scale-110 transition-transform">❌</span>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            
                                            {domain.items.length > 0 && (
                                                <div className="flex gap-1.5 bg-blue-100/80 p-1.5 md:p-2 rounded-b-xl font-black text-blue-900 border-t border-blue-200 items-center shadow-inner mt-1">
                                                    <div className="w-8"></div>
                                                    <div className="flex-1 px-1 text-sm md:text-base text-center tracking-wide drop-shadow-sm">متوسطات الأعمدة (Column Averages)</div>
                                                    {domain.scales.map(scale => {
                                                        const columnSum = domain.items.reduce((sum, item) => sum + (Number(item.values[scale.id]) || 0), 0);
                                                        const avg = columnSum / domain.items.length;
                                                        return (
                                                            <div key={`avg-row-${scale.id}`} className={`w-24 text-center px-1 font-black text-sm md:text-base drop-shadow-sm
                                                                ${scale.type === 'positive' ? 'text-green-800' : 
                                                                  scale.type === 'negative' ? 'text-red-800' : 'text-gray-800'}`}>
                                                                {avg.toFixed(1)}%
                                                            </div>
                                                        );
                                                    })}
                                                    <div className="w-20 text-center font-black text-sm md:text-base text-blue-800 drop-shadow-sm">
                                                        {(domain.items.reduce((sum, item) => sum + getItemRowTotal(item.values, domain.scales), 0) / domain.items.length).toFixed(1)}%
                                                    </div>
                                                    <div className="w-20 text-center font-black text-sm md:text-base text-green-800 drop-shadow-sm">
                                                        {(domain.items.reduce((sum, item) => sum + getPositivesTotal(item.values, domain.scales), 0) / domain.items.length).toFixed(1)}%
                                                    </div>
                                                    <div className="w-12 text-center"></div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    
                                    {domain.items.length > 0 && (
                                        <div className="mt-4 bg-slate-50 p-4 rounded-xl border border-blue-100 shadow-inner hover-zoom transition-all">
                                            <h3 className="text-lg md:text-xl font-bold text-blue-900 mb-6 text-center flex items-center justify-center gap-2 drop-shadow-sm">
                                                <span className="text-xl drop-shadow-sm">📊</span> متوسطات المحور
                                            </h3>
                                            <div className="flex justify-around items-end h-32 md:h-40 gap-2 md:gap-4 px-2 md:px-6 border-b-2 border-gray-300 pb-2 relative">
                                                <div className="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-10 pb-6">
                                                    <div className="border-t-2 border-gray-800 w-full"></div>
                                                    <div className="border-t border-gray-800 w-full"></div>
                                                    <div className="border-t border-gray-800 w-full"></div>
                                                    <div className="border-t border-gray-800 w-full"></div>
                                                </div>
                                                
                                                {domain.scales.map((scale) => {
                                                    const columnSum = domain.items.reduce((sum, item) => sum + (Number(item.values[scale.id]) || 0), 0);
                                                    const avg = columnSum / domain.items.length;
                                                    return (
                                                        <div key={`chart-${scale.id}`} className="flex flex-col items-center flex-1 group h-full justify-end z-10 relative">
                                                            <span className="mb-1 text-xs md:text-sm font-bold text-gray-800 transition-transform duration-300 group-hover:-translate-y-2 group-hover:scale-110 group-hover:text-blue-600 drop-shadow-sm bg-white/80 px-1.5 py-0.5 rounded border border-gray-200">
                                                                {avg.toFixed(1)}%
                                                            </span>
                                                            <div 
                                                                className={`w-full max-w-[40px] md:max-w-[60px] rounded-t-lg transition-all duration-700 ease-out relative shadow-sm cursor-pointer border-t border-white/50
                                                                    ${scale.type === 'positive' ? 'bg-gradient-to-t from-green-600 to-green-400 group-hover:shadow-[0_0_10px_rgba(34,197,94,0.4)]' : 
                                                                      scale.type === 'negative' ? 'bg-gradient-to-t from-red-600 to-red-400 group-hover:shadow-[0_0_10px_rgba(239,68,68,0.4)]' : 
                                                                      'bg-gradient-to-t from-slate-500 to-slate-400 group-hover:shadow-[0_0_10px_rgba(100,116,139,0.4)]'}
                                                                `}
                                                                style={{ height: `${Math.max(avg, 2)}%`, minHeight: '8px' }}
                                                            >
                                                                <div className="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity rounded-t-lg"></div>
                                                            </div>
                                                            <span className="mt-2 text-xs md:text-sm font-bold text-gray-800 text-center truncate w-full px-1 drop-shadow-sm">{scale.name}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div className="mt-4 flex justify-end border-t-2 border-gray-100 pt-3">
                                        <button
                                            onClick={() => removeDomain(domain.id)}
                                            className="btn-shiny btn-shiny-red px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1.5 shadow-sm group cursor-pointer"
                                            title="حذف المحور بالكامل"
                                        >
                                            <span className="text-base drop-shadow-sm group-hover:animate-pulse">🗑️</span> حذف المحور
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                        
                        {domains.length > 0 && (
                            <div className="flex flex-col sm:flex-row justify-center gap-4 mt-6 mb-8 hover-zoom">
                                <button onClick={addDomain} className="btn-shiny btn-shiny-green px-6 py-3 rounded-xl text-lg font-bold flex items-center justify-center gap-2.5 shadow-md border-b-4 border-green-700 group cursor-pointer w-full sm:w-auto">
                                    <span className="text-2xl drop-shadow-sm group-hover:animate-bounce">📁</span> إضافة محور مصفوفة (Grid)
                                </button>
                                <button onClick={addFrequencyQuestion} className="btn-shiny btn-shiny-purple px-6 py-3 rounded-xl text-lg font-bold flex items-center justify-center gap-2.5 shadow-md border-b-4 border-purple-700 group cursor-pointer w-full sm:w-auto">
                                    <span className="text-2xl drop-shadow-sm group-hover:animate-bounce">📊</span> إضافة سؤال تكرار/N
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
