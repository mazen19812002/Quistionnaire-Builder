<html lang="en" dir="rtl">
<head>

    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- SheetJS for Excel generation and parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html {
            font-size: 130% !important; /* Uniformly scales all Tailwind rem-based fonts, buttons, and spacing by 130% */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #dbeafe; /* Light Blue Background */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar for drag-and-drop areas */
        .drag-over {
            border: 2px dashed #3b82f6 !important;
            background-color: #eff6ff !important;
        }
        
        /* Hide number input arrows for cleaner look */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .hover-zoom {
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .hover-zoom:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.15);
        }
        
        .thin-title {
            font-weight: 300;
            letter-spacing: -0.01em;
        }
        
        /* Custom animation for shiny buttons */
        @keyframes shiny-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .btn-shiny {
            background-size: 200% 200%;
            animation: shiny-gradient 3s ease infinite;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3); /* Glassmorphism border */
            backdrop-filter: blur(5px);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .btn-shiny::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg);
            transition: all 0.5s ease;
            opacity: 0;
        }
        
        .btn-shiny:hover::after {
            opacity: 1;
            transform: rotate(45deg) translate(50%, 50%);
        }
        
        .btn-shiny:hover {
            animation: shiny-gradient 1.5s ease infinite;
            transform: scale(1.04) translateY(-2px);
        }
        
        /* Specific Button Colors mapped to exact preferences */
        .btn-shiny-purple { background-image: linear-gradient(270deg, #8b5cf6, #d946ef, #8b5cf6); box-shadow: 0 4px 10px -2px rgba(139, 92, 246, 0.5); }
        .btn-shiny-purple:hover { box-shadow: 0 8px 15px -3px rgba(139, 92, 246, 0.7); }
        
        .btn-shiny-green { background-image: linear-gradient(270deg, #10b981, #22c55e, #10b981); box-shadow: 0 4px 10px -2px rgba(34, 197, 94, 0.5); }
        .btn-shiny-teal { background-image: linear-gradient(270deg, #14b8a6, #06b6d4, #14b8a6); box-shadow: 0 4px 10px -2px rgba(6, 182, 212, 0.5); }
        .btn-shiny-teal:hover { box-shadow: 0 8px 15px -3px rgba(6, 182, 212, 0.7); }
        
        .btn-shiny-blue-green { background-image: linear-gradient(270deg, #3b82f6, #10b981, #3b82f6); box-shadow: 0 4px 10px -2px rgba(16, 185, 129, 0.5); }
        .btn-shiny-blue-green:hover { box-shadow: 0 8px 15px -3px rgba(16, 185, 129, 0.7); }

        .btn-shiny-yellow-blue { background-image: linear-gradient(270deg, #eab308, #3b82f6, #eab308); box-shadow: 0 4px 10px -2px rgba(234, 179, 8, 0.5); }
        .btn-shiny-yellow-blue:hover { box-shadow: 0 8px 15px -3px rgba(59, 130, 246, 0.7); }

        .btn-shiny-gold { background-image: linear-gradient(270deg, #FBBF24, #D97706, #FBBF24); box-shadow: 0 4px 10px -2px rgba(217, 119, 6, 0.5); }
        .btn-shiny-gold:hover { box-shadow: 0 8px 15px -3px rgba(217, 119, 6, 0.7); }

        .btn-shiny-red { background-image: linear-gradient(270deg, #ef4444, #f43f5e, #ef4444); box-shadow: 0 4px 10px -2px rgba(239, 68, 68, 0.5); }
        .btn-shiny-red:hover { box-shadow: 0 8px 15px -3px rgba(239, 68, 68, 0.7); }
        
        .btn-shiny-orange { background-image: linear-gradient(270deg, #f59e0b, #f97316, #f59e0b); box-shadow: 0 4px 10px -2px rgba(245, 158, 11, 0.5); }
        .btn-shiny-orange:hover { box-shadow: 0 8px 15px -3px rgba(245, 158, 11, 0.7); }
        
        /* Footer Progress Bar Gradient Animation */
        @keyframes progress-scroll {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
        .footer-progress-bar {
            background: linear-gradient(90deg, #1e3a8a, #3b82f6, #06b6d4, #10b981, #3b82f6, #1e3a8a);
            background-size: 200% 100%;
            animation: progress-scroll 4s linear infinite;
        }
        
        /* Custom Keyframes for Emoji Animations */
        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        .animate-wiggle {
            animation: wiggle 0.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen pb-14">
    <div id="root"></div>
    
    <!-- Personalized Footer with Indeterminate Progress Style -->
    <footer class="fixed bottom-0 left-0 w-full text-white text-center py-2 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] footer-progress-bar">
        <p class="text-xs md:text-sm font-black tracking-widest uppercase drop-shadow-md">
            All rights are reserved to Dr. Mazen Badawy – Doctor of English Teaching & Testing
        </p>
    </footer>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        /* --- Initial Data Structure Blueprint --- */
        const initialScales = [
            { id: 's1', name: 'اوافق تمام', type: 'positive' },
            { id: 's2', name: 'اوافق', type: 'positive' },
            { id: 's3', name: 'اوافق الي حد ما', type: 'positive' },
            { id: 's4', name: 'لا اوافق', type: 'negative' },
            { id: 's5', name: 'لا اوافق مطلقا', type: 'negative' }
        ];
        
        /* Domains start completely empty */
        const initialDomains = [];
        
        function App() {
            /* Scales are now encapsulated inside each domain */
            const [domains, setDomains] = useState(initialDomains);
            
            /* Modal State for avoiding native alerts/confirms */
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null, inputType: 'number' });
            
            /* Drag and drop state for items */
            const [draggedItem, setDraggedItem] = useState(null);
            const [draggedOverItem, setDraggedOverItem] = useState(null);
            
            /* Drag and drop state for domain scales (columns) */
            const [draggedScale, setDraggedScale] = useState(null); // { domainId, index }
            const [draggedOverScale, setDraggedOverScale] = useState(null); // { domainId, index }
            
            /* Number of participants */
            const [participantsCount, setParticipantsCount] = useState(100);
            
            /* Temp state for modals */
            const [tempPromptValue, setTempPromptValue] = useState(88);
            const [tempItemCount, setTempItemCount] = useState(5);
            
            /* Base file name state for exports */
            const [originalFileName, setOriginalFileName] = useState('Questionnaire');
            
            /* --- Custom Modal Helpers --- */
            const showAlert = (message) => setModalConfig({ isOpen: true, type: 'alert', message, onConfirm: null, inputType: 'number' });
            const showConfirm = (message, onConfirm) => setModalConfig({ isOpen: true, type: 'confirm', message, onConfirm, inputType: 'number' });
            const showPrompt = (message, defaultValue, onConfirm, inputType = 'number') => {
                setTempPromptValue(defaultValue);
                setModalConfig({ isOpen: true, type: 'prompt', message, onConfirm, inputType });
            };
            const closeModal = () => setModalConfig({ ...modalConfig, isOpen: false });
            
            /* --- Handlers for Auto Fill --- */
            const handleAutoFill = () => {
                if (domains.length === 0) {
                    showAlert('لا توجد محاور أو بنود لتعبئتها. يرجى إضافة محاور أولاً أو رفع ملف.');
                    return;
                }
                showPrompt('الرجاء إدخال المتوسط العام للإيجابيات المطلوب (%) لتوليد النسب بناءً عليه:', 88, (targetValue) => {
                    executeAutoFill(Number(targetValue));
                }, 'number');
            };
            
            const executeAutoFill = (targetPositiveAverage) => {
                const totalItemsCount = domains.reduce((count, domain) => count + domain.items.length, 0);
                if (totalItemsCount === 0) return;
                
                /* Pre-calculate exact positive budgets globally to hit the target average */
                let posBudgets = [];
                const targetSum = Math.round(targetPositiveAverage * totalItemsCount);
                
                /* Since each domain can have different scales, we calculate the budget limits generally */
                for (let i = 0; i < totalItemsCount; i++) {
                    let val = targetPositiveAverage + Math.floor(Math.random() * 11) - 5; /* +/- 5 fluctuation */
                    val = Math.max(1, Math.min(99, val));
                    posBudgets.push(val);
                }
                
                let currentSum = posBudgets.reduce((a, b) => a + b, 0);
                let diff = targetSum - currentSum;
                
                /* Balance the array to hit the exact sum */
                let attempts = 0;
                while (diff !== 0 && attempts < 10000) {
                    let idx = Math.floor(Math.random() * totalItemsCount);
                    if (diff > 0 && posBudgets[idx] < 100) {
                        posBudgets[idx]++;
                        diff--;
                    } else if (diff < 0 && posBudgets[idx] > 0) {
                        posBudgets[idx]--;
                        diff++;
                    }
                    attempts++;
                }
                
                let budgetIndex = 0;
                
                setDomains(prevDomains => prevDomains.map(domain => {
                    const posScales = domain.scales.filter(s => s.type === 'positive');
                    const negScales = domain.scales.filter(s => s.type === 'negative');
                    const neuScales = domain.scales.filter(s => s.type === 'neutral');
                    
                    const newItems = domain.items.map(item => {
                        let posBudget = posScales.length > 0 ? posBudgets[budgetIndex++] : 0;
                        let remainingBudget = 100 - posBudget;
                        
                        let negBudget = 0;
                        let neuBudget = 0;
                        
                        if (negScales.length > 0 && neuScales.length > 0) {
                            if (remainingBudget >= 2) {
                                const firstNeuIdx = domain.scales.findIndex(s => s.type === 'neutral');
                                const firstNegIdx = domain.scales.findIndex(s => s.type === 'negative');
                                
                                if (firstNeuIdx !== -1 && firstNegIdx !== -1 && firstNeuIdx < firstNegIdx) {
                                    neuBudget = Math.floor(remainingBudget * (0.6 + Math.random() * 0.25)); 
                                    negBudget = remainingBudget - neuBudget;
                                } else {
                                    negBudget = Math.floor(remainingBudget * (0.6 + Math.random() * 0.25)); 
                                    neuBudget = remainingBudget - negBudget;
                                }
                            } else {
                                negBudget = remainingBudget;
                                neuBudget = 0;
                            }
                        } else if (negScales.length > 0) {
                            negBudget = remainingBudget;
                        } else if (neuScales.length > 0) {
                            neuBudget = remainingBudget;
                        }
                        
                        const newValues = { ...item.values };
                        
                        const distributeDescending = (budget, scalesArray) => {
                            if (scalesArray.length === 0) return;
                            if (scalesArray.length === 1) {
                                newValues[scalesArray[0].id] = budget;
                                return;
                            }
                            
                            let parts = [];
                            let remaining = budget;
                            for (let i = 0; i < scalesArray.length - 1; i++) {
                                const maxAlloc = remaining - (scalesArray.length - 1 - i);
                                const minAlloc = 1;
                                if (maxAlloc <= minAlloc) {
                                    parts.push(minAlloc);
                                    remaining -= minAlloc;
                                } else {
                                    let avg = remaining / (scalesArray.length - i);
                                    let alloc = Math.floor(avg * 0.5) + Math.floor(Math.random() * (avg * 0.8));
                                    alloc = Math.max(minAlloc, Math.min(alloc, maxAlloc));
                                    parts.push(alloc);
                                    remaining -= alloc;
                                }
                            }
                            parts.push(remaining);
                            
                            parts.sort((a, b) => b - a);
                            scalesArray.forEach((s, index) => {
                                newValues[s.id] = parts[index];
                            });
                        };
                        
                        distributeDescending(posBudget, posScales);
                        distributeDescending(negBudget, negScales);
                        distributeDescending(neuBudget, neuScales);
                        
                        return { ...item, values: newValues };
                    });
                    return { ...domain, items: newItems };
                }));
            };
            
            /* --- Handlers for Excel Upload --- */
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const fileNameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
                setOriginalFileName(fileNameWithoutExt);
                
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const dataArray = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(dataArray, { type: 'array' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        
                        if (data.length < 2) {
                            showAlert('الملف المرفوع فارغ أو لا يحتوي على بيانات صحيحة.');
                            return;
                        }
                        
                        const headers = data[0];
                        const domainIdx = headers.indexOf('المحور') !== -1 ? headers.indexOf('المحور') : (headers.indexOf('المجال') !== -1 ? headers.indexOf('المجال') : 0);
                        const itemIdx = headers.indexOf('البنود') !== -1 ? headers.indexOf('البنود') : 1;
                        const totalIdx = headers.indexOf('المجموع') !== -1 ? headers.indexOf('المجموع') : headers.indexOf('إجمالي الصف (%)');
                        const endScaleIdx = totalIdx !== -1 ? totalIdx : headers.length;
                        const scaleNames = headers.slice(itemIdx + 1, endScaleIdx);
                        
                        const importedScalesBlueprint = scaleNames.map((name, idx) => ({
                            id: `import_base_${idx}`,
                            name: name || `مقياس ${idx + 1}`,
                            type: idx === 0 ? 'positive' : (idx === scaleNames.length - 1 ? 'negative' : 'neutral')
                        }));
                        
                        const newDomainsMap = new Map();
                        
                        for (let i = 1; i < data.length; i++) {
                            const row = data[i];
                            if (!row || row.length === 0 || !row[domainIdx]) continue;
                            
                            const domainName = row[domainIdx];
                            const itemText = row[itemIdx] || 'بند بدون نص';
                            
                            if (!newDomainsMap.has(domainName)) {
                                const domainScales = importedScalesBlueprint.map(s => ({ ...s, id: s.id + '_' + Math.random().toString(36).substr(2, 9) }));
                                newDomainsMap.set(domainName, {
                                    id: `import_d_${newDomainsMap.size}_${Date.now()}`,
                                    name: domainName,
                                    items: [],
                                    scales: domainScales
                                });
                            }
                            
                            const domainObj = newDomainsMap.get(domainName);
                            const itemValues = {};
                            
                            domainObj.scales.forEach((scale, idx) => {
                                const cellVal = row[itemIdx + 1 + idx];
                                let numVal = 0;
                                if (cellVal !== undefined && cellVal !== null && cellVal !== '') {
                                    if (typeof cellVal === 'string') {
                                        numVal = Number(cellVal.replace('%', '').trim());
                                    } else {
                                        numVal = Number(cellVal);
                                    }
                                } else {
                                    numVal = '';
                                }
                                itemValues[scale.id] = isNaN(numVal) ? '' : numVal;
                            });
                            
                            domainObj.items.push({
                                id: `import_i_${domainObj.items.length}_${Date.now()}_${Math.random()}`,
                                text: itemText,
                                values: itemValues
                            });
                        }
                        
                        const parsedDomains = Array.from(newDomainsMap.values());
                        setDomains(parsedDomains);
                        
                        e.target.value = '';
                        
                    } catch (error) {
                        console.error("Error parsing file:", error);
                        showAlert('حدث خطأ أثناء قراءة الملف. يرجى التأكد من أنه بصيغة Excel صالحة وأن الأعمدة تحتوي على (المحور، البنود).');
                    }
                };
                reader.readAsArrayBuffer(file);
            };
            
            /* --- Handler for loading previously exported evaluations --- */
            const handleLoadProject = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const fileNameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
                setOriginalFileName(fileNameWithoutExt);
                
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const dataArray = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(dataArray, { type: 'array' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        
                        if (data.length < 2) {
                            showAlert('الملف المرفوع فارغ أو لا يحتوي على بيانات صحيحة.');
                            return;
                        }
                        
                        let currentScalesBlueprint = [];
                        let itemIdx = 1;
                        const newDomainsMap = new Map();
                        
                        for (let i = 0; i < data.length; i++) {
                            const row = data[i];
                            // Skip empty rows completely
                            if (!row || row.length === 0 || row[0] === undefined || row[0] === null || row[0] === '') continue;
                            
                            const col0 = String(row[0]).trim();
                            
                            // Skip the summary/average rows dynamically generated during export
                            if (col0.startsWith('متوسط إيجابيات') || col0.startsWith('متوسطات الأعمدة') || col0.startsWith('متوسطات')) {
                                continue;
                            }
                            
                            // Identify header rows (in case of multiple domains, export repeats headers)
                            if (col0 === 'المحور' || col0 === 'المجال') {
                                itemIdx = row.indexOf('البنود') !== -1 ? row.indexOf('البنود') : 1;
                                let scalesEndIdx = row.findIndex((h, idx) => idx > itemIdx && h && (String(h).includes('إجمالي') || String(h).includes('المجموع')));
                                if (scalesEndIdx === -1) scalesEndIdx = row.length;
                                
                                const scaleNames = row.slice(itemIdx + 1, scalesEndIdx);
                                currentScalesBlueprint = scaleNames.map((name, idx) => ({
                                    name: name || `مقياس ${idx+1}`,
                                    type: idx === 0 ? 'positive' : (idx === scaleNames.length - 1 ? 'negative' : 'neutral')
                                }));
                                continue; // Skip to next row, since this is a header
                            }
                            
                            // Process Standard Data Row
                            const domainName = col0;
                            const itemText = row[itemIdx] || 'بند بدون نص';
                            
                            if (!newDomainsMap.has(domainName)) {
                                const domainScales = currentScalesBlueprint.map(s => ({ ...s, id: 's_' + Date.now() + Math.random().toString(36).substr(2, 9) }));
                                newDomainsMap.set(domainName, {
                                    id: `import_d_${newDomainsMap.size}_${Date.now()}`,
                                    name: domainName,
                                    items: [],
                                    scales: domainScales
                                });
                            }
                            
                            const domainObj = newDomainsMap.get(domainName);
                            const itemValues = {};
                            
                            domainObj.scales.forEach((scale, idx) => {
                                const cellVal = row[itemIdx + 1 + idx];
                                let numVal = 0;
                                if (cellVal !== undefined && cellVal !== null && cellVal !== '') {
                                    if (typeof cellVal === 'string') {
                                        numVal = Number(cellVal.replace(/%/g, '').trim());
                                    } else {
                                        numVal = Number(cellVal);
                                    }
                                } else {
                                    numVal = '';
                                }
                                itemValues[scale.id] = isNaN(numVal) ? '' : numVal;
                            });
                            
                            domainObj.items.push({
                                id: `import_i_${domainObj.items.length}_${Date.now()}_${Math.random()}`,
                                text: itemText,
                                values: itemValues
                            });
                        }
                        
                        const parsedDomains = Array.from(newDomainsMap.values());
                        if (parsedDomains.length > 0) {
                            setDomains(parsedDomains);
                        } else {
                            showAlert('لم يتم العثور على بيانات صالحة. تأكد من أن الملف هو تقييم تم تصديره سابقاً.');
                        }
                        
                        e.target.value = ''; // clear input
                        
                    } catch (error) {
                        console.error("Error parsing file:", error);
                        showAlert('حدث خطأ أثناء قراءة الملف. يرجى التأكد من أنه بصيغة Excel/CSV صالحة.');
                    }
                };
                reader.readAsArrayBuffer(file);
            };
            
            /* --- Handlers for Domains, Items & Per-Domain Scales --- */
            const addDomain = () => {
                const nextNum = domains.length + 1;
                const defaultName = `محور جديد ${nextNum}`;
                
                setTempPromptValue(defaultName);
                setTempItemCount(5); /* Default 5 items */
                
                setModalConfig({ 
                    isOpen: true, 
                    type: 'addDomain', 
                    message: 'الرجاء إدخال بيانات المحور الجديد:', 
                    onConfirm: (inputValue, itemCount) => {
                        const finalName = String(inputValue || '').trim() || defaultName;
                        const newDomainId = Date.now().toString();
                        
                        // Give the new domain a fresh, isolated copy of the initial scales
                        const newDomainScales = initialScales.map(s => ({ ...s, id: s.id + '_' + Date.now() + Math.random().toString(36).substr(2, 5) }));
                        
                        const initialVals = {};
                        newDomainScales.forEach(s => initialVals[s.id] = '');
                        
                        const newItems = Array.from({ length: itemCount || 5 }, (_, i) => ({
                            id: `item_${newDomainId}_${i}_${Math.random()}`,
                            text: `بند ${i + 1}`,
                            values: { ...initialVals }
                        }));
                        
                        setDomains(prev => [...prev, { id: newDomainId, name: finalName, items: newItems, scales: newDomainScales }]);
                    }
                });
            };
            
            const updateDomain = (id, field, value) => {
                setDomains(domains.map(d => d.id === id ? { ...d, [field]: value } : d));
            };
            
            const removeDomain = (id) => {
                showConfirm('هل أنت متأكد من حذف هذا المحور؟', () => {
                    setDomains(domains.filter(d => d.id !== id));
                });
            };
            
            const addItem = (domainId) => {
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        const initialVals = {};
                        d.scales.forEach(s => initialVals[s.id] = '');
                        return { ...d, items: [...d.items, { id: Date.now().toString(), text: 'بند جديد', values: initialVals }] };
                    }
                    return d;
                }));
            };
            
            const updateItemText = (domainId, itemId, text) => {
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return { ...d, items: d.items.map(i => i.id === itemId ? { ...i, text } : i) };
                    }
                    return d;
                }));
            };
            
            const updateItemValue = (domainId, itemId, scaleId, value) => {
                const finalValue = value === '' ? '' : Number(value);
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return {
                            ...d,
                            items: d.items.map(i => i.id === itemId ? {
                                ...i,
                                values: { ...i.values, [scaleId]: finalValue }
                            } : i)
                        };
                    }
                    return d;
                }));
            };
            
            const removeItem = (domainId, itemId) => {
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        return { ...d, items: d.items.filter(i => i.id !== itemId) };
                    }
                    return d;
                }));
            };
            
            /* --- Scale (Column) Management PER DOMAIN --- */
            const addScale = (domainId) => {
                const newId = 's_' + Date.now().toString() + Math.random().toString(36).substr(2, 5);
                setDomains(domains.map(d => {
                    if (d.id === domainId) {
                        const newScales = [...d.scales, { id: newId, name: 'مقياس جديد', type: 'positive' }];
                        const newItems = d.items.map(item => ({ ...item, values: { ...item.values, [newId]: '' } }));
                        return { ...d, scales: newScales, items: newItems };
                    }
                    return d;
                }));
            };
            
            const updateScaleName = (domainId, scaleId, newName) => {
                setDomains(domains.map(d => d.id === domainId ? { ...d, scales: d.scales.map(s => s.id === scaleId ? { ...s, name: newName } : s) } : d));
            };
            
            const updateScaleType = (domainId, scaleId, newType) => {
                setDomains(domains.map(d => d.id === domainId ? { ...d, scales: d.scales.map(s => s.id === scaleId ? { ...s, type: newType } : s) } : d));
            };
            
            const removeScale = (domainId, scaleId) => {
                showConfirm('هل أنت متأكد من حذف هذا العمود؟ سيتم حذفه من جميع البنود في هذا المحور.', () => {
                    setDomains(domains.map(d => {
                        if (d.id === domainId) {
                            const newScales = d.scales.filter(s => s.id !== scaleId);
                            const newItems = d.items.map(item => {
                                const newValues = { ...item.values };
                                delete newValues[scaleId];
                                return { ...item, values: newValues };
                            });
                            return { ...d, scales: newScales, items: newItems };
                        }
                        return d;
                    }));
                });
            };
            
            const handleScaleDragStart = (e, domainId, index) => {
                setDraggedScale({ domainId, index });
                e.dataTransfer.effectAllowed = "move";
                const ghostNode = e.target.cloneNode(true);
                ghostNode.style.opacity = "0.5";
                document.body.appendChild(ghostNode);
                e.dataTransfer.setDragImage(ghostNode, 0, 0);
                setTimeout(() => document.body.removeChild(ghostNode), 0);
            };
            
            const handleScaleDragOver = (e, domainId, index) => {
                e.preventDefault();
                setDraggedOverScale({ domainId, index });
            };
            
            const handleScaleDrop = (e, targetDomainId, targetIndex) => {
                e.preventDefault();
                if (!draggedScale || draggedScale.domainId !== targetDomainId) {
                    setDraggedScale(null);
                    setDraggedOverScale(null);
                    return; // Can't drop a scale into a different domain
                }
                
                setDomains(domains.map(d => {
                    if (d.id === targetDomainId) {
                        const newScales = [...d.scales];
                        const scaleToMove = newScales.splice(draggedScale.index, 1)[0];
                        newScales.splice(targetIndex, 0, scaleToMove);
                        return { ...d, scales: newScales };
                    }
                    return d;
                }));
                
                setDraggedScale(null);
                setDraggedOverScale(null);
            };
            
            const handleScaleDragEnd = () => {
                setDraggedScale(null);
                setDraggedOverScale(null);
            };
            
            /* --- Drag and Drop Logic for Items --- */
            const handleDragStart = (e, domainId, itemIndex) => {
                setDraggedItem({ domainId, itemIndex });
                e.dataTransfer.effectAllowed = "move";
            };
            
            const handleDragOver = (e, domainId, itemIndex) => {
                e.preventDefault();
                setDraggedOverItem({ domainId, itemIndex });
            };
            
            const handleDrop = (e, targetDomainId, targetItemIndex) => {
                e.preventDefault();
                if (!draggedItem) return;
                
                let newDomains = [...domains];
                const sourceDomainIndex = newDomains.findIndex(d => d.id === draggedItem.domainId);
                const targetDomainIndex = newDomains.findIndex(d => d.id === targetDomainId);
                
                if (sourceDomainIndex === -1 || targetDomainIndex === -1) return;
                
                const itemToMove = newDomains[sourceDomainIndex].items[draggedItem.itemIndex];
                
                // Map values if crossing domains
                if (draggedItem.domainId !== targetDomainId) {
                    const sourceScales = newDomains[sourceDomainIndex].scales;
                    const targetScales = newDomains[targetDomainIndex].scales;
                    const newValues = {};
                    targetScales.forEach((tScale, idx) => { 
                         if(sourceScales[idx]) {
                             newValues[tScale.id] = itemToMove.values[sourceScales[idx].id];
                         } else {
                             newValues[tScale.id] = '';
                         }
                    });
                    itemToMove.values = newValues;
                }
                
                newDomains[sourceDomainIndex].items.splice(draggedItem.itemIndex, 1);
                if (targetItemIndex !== undefined) {
                    newDomains[targetDomainIndex].items.splice(targetItemIndex, 0, itemToMove);
                } else {
                    newDomains[targetDomainIndex].items.push(itemToMove);
                }
                
                setDomains(newDomains);
                setDraggedItem(null);
                setDraggedOverItem(null);
            };
            
            const handleDragEnd = () => {
                setDraggedItem(null);
                setDraggedOverItem(null);
            };
            
            /* --- Handler for Excel Column Paste --- */
            const handleColumnPaste = (e, domainId, startItemIndex, fieldType, scaleId = null) => {
                const pasteData = e.clipboardData.getData('text');
                if (!pasteData) return;

                // Split by newline. Excel copies columns with trailing newlines.
                let lines = pasteData.split(/\r\n|\n|\r/);
                if (lines.length > 0 && lines[lines.length - 1] === '') {
                    lines.pop(); // Remove the last empty element caused by trailing newline
                }

                // If it's more than one line, handle as a vertical column paste
                if (lines.length > 1) {
                    e.preventDefault(); // Stop default paste into single cell

                    setDomains(prevDomains => prevDomains.map(d => {
                        if (d.id === domainId) {
                            let newItems = [...d.items];

                            // Auto-expand rows if pasted data exceeds current rows
                            const rowsNeeded = startItemIndex + lines.length - newItems.length;
                            for (let i = 0; i < rowsNeeded; i++) {
                                const initialVals = {};
                                d.scales.forEach(s => initialVals[s.id] = '');
                                newItems.push({
                                    id: `item_pasted_${Date.now()}_${Math.random()}`,
                                    text: 'بند جديد',
                                    values: initialVals
                                });
                            }

                            // Apply pasted data sequentially downwards
                            lines.forEach((line, idx) => {
                                const targetIdx = startItemIndex + idx;
                                const cleanLine = line.trim();
                                
                                if (fieldType === 'text') {
                                    newItems[targetIdx] = { ...newItems[targetIdx], text: cleanLine };
                                } else if (fieldType === 'value' && scaleId) {
                                    let numVal = Number(cleanLine.replace(/%/g, ''));
                                    newItems[targetIdx] = { 
                                        ...newItems[targetIdx], 
                                        values: { ...newItems[targetIdx].values, [scaleId]: isNaN(numVal) ? '' : numVal } 
                                    };
                                }
                            });

                            return { ...d, items: newItems };
                        }
                        return d;
                    }));
                }
            };
            
            /* --- Calculation Helpers --- */
            const getItemRowTotal = (values, domainScales) => {
                return domainScales.reduce((sum, scale) => sum + (Number(values[scale.id]) || 0), 0);
            };
            
            const getPositivesTotal = (values, domainScales) => {
                return domainScales.filter(s => s.type === 'positive').reduce((sum, scale) => sum + (Number(values[scale.id]) || 0), 0);
            };
            
            /* --- Calculating Overall Positives Average --- */
            const totalItemsCount = domains.reduce((count, domain) => count + domain.items.length, 0);
            const overallPositiveAverage = totalItemsCount === 0 ? 0 :
                domains.reduce((sum, domain) => {
                    return sum + domain.items.reduce((itemSum, item) => itemSum + getPositivesTotal(item.values, domain.scales), 0);
                }, 0) / totalItemsCount;
                
            /* --- Get formatted date and time string --- */
            const getFormattedDateTime = () => {
                const d = new Date();
                const yy = String(d.getFullYear()).slice(-2);
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                const ss = String(d.getSeconds()).padStart(2, '0');
                return `${yy}${mm}${dd}_${hh}${min}${ss}`;
            };
            
            /* --- Excel Export Functions --- */
            const exportEmptyTemplate = () => {
                const data = [];
                const header = ['المحور', 'البنود', ...initialScales.map(s => s.name), 'إجمالي الصف', 'الإيجابيات'];
                data.push(header);
                data.push(['المحور الأول', 'البند الأول', ...initialScales.map(() => ''), '', '']);
                data.push(['المحور الأول', 'البند الثاني', ...initialScales.map(() => ''), '', '']);
                
                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Empty_Template");
                XLSX.writeFile(wb, `Empty_Template_${getFormattedDateTime()}.xlsx`);
            };
            
            const exportTemplate = () => {
                if (domains.length === 0) {
                    showAlert('يرجى إضافة بيانات لتصديرها أولاً.');
                    return;
                }
                const data = [];
                
                domains.forEach(domain => {
                    const header = ['المحور', 'البنود', ...domain.scales.map(s => s.name), 'إجمالي الصف', 'الإيجابيات'];
                    data.push(header);
                    
                    domain.items.forEach(item => {
                        const row = [domain.name, item.text];
                        domain.scales.forEach(s => row.push(Number(item.values[s.id]) || 0));
                        row.push(Number(getItemRowTotal(item.values, domain.scales).toFixed(1)));
                        const posTotal = getPositivesTotal(item.values, domain.scales);
                        row.push(Number(posTotal.toFixed(1)));
                        data.push(row);
                    });
                    
                    if (domain.items.length > 0) {
                        const scaleAverages = domain.scales.map(scale => {
                            const columnSum = domain.items.reduce((sum, item) => sum + (Number(item.values[scale.id]) || 0), 0);
                            return Number((columnSum / domain.items.length).toFixed(1));
                        });
                        
                        const rowTotalAvg = Number((domain.items.reduce((sum, item) => sum + getItemRowTotal(item.values, domain.scales), 0) / domain.items.length).toFixed(1));
                        const posTotalAvg = Number((domain.items.reduce((sum, item) => sum + getPositivesTotal(item.values, domain.scales), 0) / domain.items.length).toFixed(1));

                        const summaryRow = [
                            `متوسطات الأعمدة (${domain.name})`,
                            '', 
                            ...scaleAverages,
                            rowTotalAvg, 
                            posTotalAvg 
                        ];
                        data.push(summaryRow);
                        data.push(Array(header.length).fill('')); 
                    }
                });
                
                const ws = XLSX.utils.aoa_to_sheet(data);
                
                // Apply Excel number formatting to show the % sign while keeping the raw numeric value for calculations
                for (const cellRef in ws) {
                    if (cellRef.startsWith('!')) continue;
                    const cell = ws[cellRef];
                    if (typeof cell.v === 'number') {
                        // Display integers as "85%" and floats as "85.5%"
                        cell.z = Number.isInteger(cell.v) ? '0"%"' : '0.0"%"';
                    }
                }
                
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template");
                XLSX.writeFile(wb, `${originalFileName}_${getFormattedDateTime()}.xlsx`);
            };
            
            const exportGoogleFormsMock = () => {
                if (domains.length === 0) {
                    showAlert('يرجى إضافة بيانات لإنشاء نتائج وهمية أولاً.');
                    return;
                }
                const data = [];
                const allItems = domains.flatMap(d => d.items.map(i => ({
                    domainId: d.id,
                    question: `${d.name} [${i.text}]`,
                    values: i.values
                })));
                
                const header = ['Timestamp', ...allItems.map(i => i.question)];
                data.push(header);
                
                const itemColumns = allItems.map(itemObj => {
                    const domainScales = domains.find(d => d.id === itemObj.domainId).scales;
                    let distribution = [];
                    let counts = domainScales.map(s => {
                        const percentage = Number(itemObj.values[s.id]) || 0;
                        return {
                            name: s.name,
                            exactCount: Math.floor((percentage / 100) * participantsCount),
                            fraction: ((percentage / 100) * participantsCount) % 1
                        };
                    });
                    
                    let currentTotal = counts.reduce((sum, c) => sum + c.exactCount, 0);
                    let remainder = participantsCount - currentTotal;
                    counts.sort((a, b) => b.fraction - a.fraction);
                    
                    for (let i = 0; i < remainder; i++) {
                        counts[i % counts.length].exactCount++;
                    }
                    counts.forEach(c => {
                        for (let i = 0; i < c.exactCount; i++) {
                            distribution.push(c.name);
                        }
                    });
                    for (let i = distribution.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
                    }
                    return distribution;
                });
                
                for (let i = 0; i < participantsCount; i++) {
                    const row = [];
                    const date = new Date(Date.now() - Math.floor(Math.random() * 7 * 24 * 60 * 60 * 1000));
                    row.push(date.toLocaleString('en-GB'));
                    itemColumns.forEach(column => {
                        row.push(column[i]);
                    });
                    data.push(row);
                }
                
                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Form Responses");
                XLSX.writeFile(wb, `${originalFileName}_Forms_${getFormattedDateTime()}.xlsx`);
            };
            
            return (
                <div className="max-w-screen-2xl mx-auto p-2 md:p-4 font-sans relative">
                    {/* --- Custom Modal Overlay --- */}
                    {modalConfig.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 transition-opacity duration-300 backdrop-blur-sm">
                            <div className="bg-white p-5 rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.3)] max-w-md w-full text-center border-t-4 border-blue-500 transform scale-100 transition-transform duration-300">
                                <h3 className="text-xl font-black mb-3 text-gray-800 drop-shadow-sm">
                                    {modalConfig.type === 'alert' ? 'تنبيه' : modalConfig.type === 'confirm' ? 'تأكيد الإجراء' : 'إدخال البيانات'}
                                </h3>
                                <p className="text-sm md:text-base text-gray-600 mb-5 font-bold leading-relaxed">{modalConfig.message}</p>
                                
                                {modalConfig.type === 'prompt' && modalConfig.inputType === 'number' && (
                                    <div className="flex items-stretch justify-center shadow-inner rounded-lg overflow-hidden border border-gray-300 mb-5 mx-auto w-3/4 bg-gray-50">
                                        <button 
                                            onClick={() => setTempPromptValue(Math.max(0, Number(tempPromptValue) - 1))}
                                            className="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-2 flex items-center justify-center transition-colors border-l border-gray-300 cursor-pointer"
                                        >
                                            <i className="fas fa-minus text-sm"></i>
                                        </button>
                                        <input
                                            type="number"
                                            min="0" max="100"
                                            value={tempPromptValue}
                                            onChange={(e) => setTempPromptValue(e.target.value)}
                                            className="w-full p-2 text-xl text-center focus:outline-none font-black text-green-700 flex-1 bg-transparent"
                                        />
                                        <button 
                                            onClick={() => setTempPromptValue(Math.min(100, Number(tempPromptValue) + 1))}
                                            className="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-2 flex items-center justify-center transition-colors border-r border-gray-300 cursor-pointer"
                                        >
                                            <i className="fas fa-plus text-sm"></i>
                                        </button>
                                    </div>
                                )}
                                
                                {modalConfig.type === 'prompt' && modalConfig.inputType === 'text' && (
                                    <input
                                        type="text"
                                        value={tempPromptValue}
                                        onChange={(e) => setTempPromptValue(e.target.value)}
                                        className="w-full p-2.5 border border-gray-300 rounded-lg text-lg text-center focus:outline-none focus:border-green-500 font-black text-blue-700 mb-5 shadow-inner bg-gray-50"
                                    />
                                )}
                                
                                {modalConfig.type === 'addDomain' && (
                                    <div className="mb-5 space-y-3">
                                        <div>
                                            <label className="block text-gray-700 font-bold mb-1.5 text-right text-sm">اسم المحور</label>
                                            <input
                                                type="text"
                                                value={tempPromptValue}
                                                onChange={(e) => setTempPromptValue(e.target.value)}
                                                className="w-full p-2.5 border border-gray-300 rounded-lg text-lg text-center focus:outline-none focus:border-blue-500 font-black text-blue-700 shadow-inner bg-gray-50"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-bold mb-1.5 text-right text-sm">عدد البنود</label>
                                            <input
                                                type="number"
                                                min="1" max="100"
                                                value={tempItemCount}
                                                onChange={(e) => setTempItemCount(Math.max(1, parseInt(e.target.value) || 1))}
                                                className="w-full p-2.5 border border-gray-300 rounded-lg text-lg text-center focus:outline-none focus:border-green-500 font-black text-green-700 shadow-inner bg-gray-50"
                                            />
                                        </div>
                                    </div>
                                )}
                                
                                <div className="flex justify-center gap-2">
                                    {(modalConfig.type === 'confirm' || modalConfig.type === 'prompt' || modalConfig.type === 'addDomain') && (
                                        <button
                                            onClick={() => { if (modalConfig.onConfirm) modalConfig.onConfirm(tempPromptValue, tempItemCount); closeModal(); }}
                                            className="btn-shiny btn-shiny-green px-4 py-2.5 rounded-lg text-sm font-bold w-full group flex items-center justify-center gap-1.5 cursor-pointer"
                                        >
                                            <span className="text-base drop-shadow-sm group-hover:animate-bounce">✅</span> تأكيد
                                        </button>
                                    )}
                                    <button
                                        onClick={closeModal}
                                        className="btn-shiny btn-shiny-red px-4 py-2.5 rounded-lg text-sm font-bold w-full group flex items-center justify-center gap-1.5 cursor-pointer"
                                    >
                                        <span className="text-base drop-shadow-sm group-hover:scale-110 transition-transform">❌</span> {modalConfig.type === 'alert' ? 'حسناً' : 'إلغاء'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Top Navigation & Logos */}
                    <div className="flex justify-between items-center mb-4 bg-white p-2 md:p-3 rounded-xl shadow-md hover-zoom border-t-4 border-blue-500">
                        <img src="https://mazen19812002.github.io/Questionnaire-Multi-Scales-/00.png" alt="Logo Right" className="h-8 md:h-12 w-auto object-contain drop-shadow-sm" />
                        <a href="https://mazen19812002.github.io/Questionnaire-Multi-Scales-/" className="btn-shiny btn-shiny-gold px-4 py-2 rounded-lg text-sm md:text-base flex items-center gap-1.5 font-bold leading-tight group cursor-pointer">
                            <span className="text-lg drop-shadow-sm group-hover:animate-bounce">🏠</span> الرئيسية
                        </a>
                        <img src="https://mazen19812002.github.io/Questionnaire-Multi-Scales-/02.jpg" alt="Logo Left" className="h-8 md:h-12 w-auto object-contain rounded-lg shadow-sm border border-gray-100" />
                    </div>
                    
                    {/* Header */}
                    <div className="text-center mb-5">
                        <h1 className="text-2xl md:text-3xl thin-title text-blue-900 mb-1 font-black drop-shadow-sm">برنامج تصميم الاستبيانات</h1>
                        <p className="text-sm md:text-base thin-title text-blue-700 font-bold drop-shadow-sm">Design Sub-items, Columns, and Percentages</p>
                    </div>
                    
                    {/* Advanced Tools Section & Exports */}
                    <div className="bg-white p-3 rounded-xl shadow-md mb-5 border-t-4 border-green-500 hover-zoom">
                        <div className="flex flex-wrap justify-center gap-2">
                            <button onClick={exportEmptyTemplate} className="btn-shiny btn-shiny-yellow-blue px-3 py-1.5 rounded-lg text-xs md:text-sm flex items-center gap-1.5 font-bold leading-tight group cursor-pointer">
                                <span className="text-base drop-shadow-sm group-hover:-translate-y-1 transition-transform">📥</span> تحميل قالب فارغ
                            </button>
                            <label className="btn-shiny btn-shiny-yellow-blue px-3 py-1.5 rounded-lg text-xs md:text-sm cursor-pointer flex items-center gap-1.5 m-0 font-bold leading-tight group">
                                <span className="text-base drop-shadow-sm group-hover:-translate-y-1 transition-transform">📤</span> رفع قالب (Excel)
                                <input type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleFileUpload} />
                            </label>
                            <label className="btn-shiny btn-shiny-blue-green px-3 py-1.5 rounded-lg text-xs md:text-sm cursor-pointer flex items-center gap-1.5 m-0 font-bold leading-tight group">
                                <span className="text-base drop-shadow-sm group-hover:-translate-y-1 transition-transform">📂</span> فتح تقييم محفوظ
                                <input type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleLoadProject} />
                            </label>
                            <button onClick={handleAutoFill} className="btn-shiny btn-shiny-orange px-4 py-1.5 rounded-lg text-sm md:text-base flex items-center gap-1.5 font-black leading-tight group cursor-pointer">
                                <span className="text-lg drop-shadow-sm group-hover:animate-wiggle">🪄</span> تعبئة تلقائية
                            </button>
                            <button onClick={exportTemplate} className="btn-shiny btn-shiny-green px-3 py-1.5 rounded-lg text-xs md:text-sm flex items-center gap-1.5 font-bold leading-tight group cursor-pointer">
                                <span className="text-base drop-shadow-sm group-hover:scale-110 transition-transform">💾</span> تحميل التقييم
                            </button>
                            <button onClick={exportGoogleFormsMock} className="btn-shiny btn-shiny-purple px-3 py-1.5 rounded-lg text-xs md:text-sm flex items-center gap-1.5 font-bold leading-tight group cursor-pointer">
                                <span className="text-base drop-shadow-sm group-hover:animate-spin">🎭</span> نتائج وهمية (Forms)
                            </button>
                        </div>
                    </div>
                    
                    {/* Settings - Participants Count */}
                    <div className="bg-white p-3 rounded-xl shadow-md mb-5 border-t-4 border-teal-500 flex flex-col sm:flex-row justify-center items-center gap-3 hover-zoom">
                        <h2 className="text-base md:text-lg thin-title text-gray-800 font-bold m-0 drop-shadow-sm flex items-center gap-2">
                            <span className="text-xl animate-pulse">👥</span> عدد المشاركين (Participants)
                        </h2>
                        <div className="flex items-center gap-2">
                            <div className="flex items-stretch shadow-inner rounded-lg overflow-hidden border border-gray-200 bg-gray-50 p-0.5">
                                <button 
                                    onClick={() => setParticipantsCount(Math.max(1, participantsCount - 1))}
                                    className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 flex items-center justify-center transition-colors border-l border-gray-300 rounded-r cursor-pointer"
                                >
                                    <i className="fas fa-minus text-sm"></i>
                                </button>
                                <input
                                    type="number"
                                    min="1"
                                    value={participantsCount}
                                    onChange={(e) => setParticipantsCount(Math.max(1, Number(e.target.value)))}
                                    className="w-20 p-2 text-xl text-center focus:outline-none font-black text-teal-800 leading-none bg-transparent"
                                />
                                <button 
                                    onClick={() => setParticipantsCount(participantsCount + 1)}
                                    className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 flex items-center justify-center transition-colors border-r border-gray-300 rounded-l cursor-pointer"
                                >
                                    <i className="fas fa-plus text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    {/* Overall Positives Average Banner */}
                    {totalItemsCount > 0 && (
                        <div className="bg-green-100 border-t-4 border-green-500 p-3 md:p-4 rounded-xl shadow-md mb-5 flex flex-col md:flex-row justify-between items-center gap-3 hover-zoom">
                            <h2 className="text-lg md:text-xl thin-title text-green-900 font-black drop-shadow-sm flex items-center gap-2">
                                <span>🎯</span> المتوسط العام للإيجابيات (Overall Positive Average)
                            </h2>
                            <div className="text-xl md:text-2xl font-black text-green-700 bg-white px-4 py-2 rounded-lg shadow-sm border border-green-200">
                                {overallPositiveAverage.toFixed(1)}%
                            </div>
                        </div>
                    )}
                    
                    {/* Domains Layout */}
                    <div className="mb-6">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-xl md:text-2xl thin-title text-gray-800 font-black drop-shadow-sm flex items-center gap-2">
                                <span>📋</span> المحاور والبنود (Axes Matrix)
                            </h2>
                        </div>
                        
                        {domains.length === 0 && (
                            <div className="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-400 text-center hover-zoom mb-4">
                                <span className="text-5xl drop-shadow-sm mb-3 inline-block animate-bounce">📁</span>
                                <h3 className="text-xl text-blue-800 font-black mb-2">لا توجد محاور لعرضها حالياً</h3>
                                <p className="text-gray-500 text-sm font-bold">قم بإضافة محور جديد أو رفع ملف قالب Excel للبدء في تصميم استبيانك.</p>
                                
                                <button
                                    onClick={addDomain}
                                    className="mt-5 btn-shiny btn-shiny-green px-5 py-2.5 rounded-xl text-lg font-black flex items-center gap-2 mx-auto group shadow-md cursor-pointer"
                                >
                                    <span className="text-xl drop-shadow-sm group-hover:scale-110 transition-transform">➕</span> إضافة محور جديد
                                </button>
                            </div>
                        )}
                        
                        {domains.map(domain => (
                            <div 
                                key={domain.id} 
                                className="bg-white p-3 md:p-4 rounded-xl shadow-md mb-5 border-r-4 border-blue-500 hover-zoom"
                                onDragOver={(e) => {
                                    if (domain.items.length === 0) handleDragOver(e, domain.id, 0);
                                }}
                                onDrop={(e) => {
                                    if (domain.items.length === 0) handleDrop(e, domain.id, 0);
                                }}
                            >
                                {/* Domain Header */}
                                <div className="flex flex-col md:flex-row gap-2 mb-4 pb-4 border-b-2 border-blue-100 items-end">
                                    <div className="flex-1 w-full">
                                        <label className="block text-blue-800 mb-1 text-xs font-black uppercase tracking-widest drop-shadow-sm">اسم المحور</label>
                                        <input
                                            type="text"
                                            value={domain.name}
                                            onChange={(e) => updateDomain(domain.id, 'name', e.target.value)}
                                            className="w-full p-2 md:p-2.5 border border-blue-200 rounded-lg text-lg md:text-xl font-black focus:outline-none focus:border-blue-500 bg-blue-50/50 shadow-inner"
                                            placeholder="أدخل اسم المحور"
                                        />
                                    </div>
                                    <div className="flex gap-2 shrink-0 w-full md:w-auto justify-center">
                                        <button
                                            onClick={() => addItem(domain.id)}
                                            className="btn-shiny btn-shiny-blue px-4 py-2 rounded-lg text-sm md:text-base font-bold h-fit flex items-center gap-1.5 justify-center shadow-sm group cursor-pointer"
                                        >
                                            <span className="text-lg drop-shadow-sm group-hover:animate-bounce">📝</span> إضافة بند (سؤال)
                                        </button>
                                    </div>
                                </div>
                                
                                {/* --- Independent Scale Columns Manager for this Domain --- */}
                                <div className="bg-slate-50 p-3 rounded-xl border border-gray-200 mb-4 shadow-inner">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="text-sm md:text-base font-bold text-gray-700 flex items-center gap-1.5 drop-shadow-sm">
                                            <span className="text-lg">📊</span> أعمدة / مقاييس المحور
                                        </h3>
                                        <button
                                            onClick={() => addScale(domain.id)}
                                            className="btn-shiny btn-shiny-green px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm group cursor-pointer"
                                        >
                                            <span className="text-sm drop-shadow-sm group-hover:scale-110 transition-transform">➕</span> عمود جديد
                                        </button>
                                    </div>
                                    
                                    <div className="flex flex-wrap gap-1.5">
                                        {domain.scales.map((scale, index) => {
                                            const isDraggedOver = draggedOverScale && draggedOverScale.domainId === domain.id && draggedOverScale.index === index;
                                            return (
                                                <div
                                                    key={scale.id}
                                                    draggable
                                                    onDragStart={(e) => handleScaleDragStart(e, domain.id, index)}
                                                    onDragOver={(e) => handleScaleDragOver(e, domain.id, index)}
                                                    onDrop={(e) => handleScaleDrop(e, domain.id, index)}
                                                    onDragEnd={handleScaleDragEnd}
                                                    className={`flex flex-col sm:flex-row items-center gap-1 bg-white border p-1 rounded-lg shadow-sm cursor-move transition-all hover:shadow-md
                                                        ${isDraggedOver ? 'border-dashed border-2 border-blue-500 bg-blue-50 scale-105' : 'border-gray-300'}
                                                    `}
                                                    title="اسحب لتغيير الترتيب داخل المحور"
                                                >
                                                    <i className="fas fa-grip-vertical text-gray-400 px-1 text-sm hover:text-blue-500"></i>
                                                    <input
                                                        type="text"
                                                        value={scale.name}
                                                        onChange={(e) => updateScaleName(domain.id, scale.id, e.target.value)}
                                                        className="p-1 border border-gray-200 rounded text-xs focus:outline-none focus:border-blue-500 w-20 text-center font-bold bg-gray-50"
                                                        placeholder="اسم العمود"
                                                    />
                                                    <select
                                                        value={scale.type || 'neutral'}
                                                        onChange={(e) => updateScaleType(domain.id, scale.id, e.target.value)}
                                                        className={`p-1 border border-gray-200 rounded text-xs focus:outline-none font-bold cursor-pointer
                                                            ${scale.type === 'positive' ? 'text-green-700 bg-green-50' : 
                                                                scale.type === 'negative' ? 'text-red-700 bg-red-50' : 
                                                                    'text-gray-700 bg-gray-50'}`}
                                                    >
                                                        <option value="positive">إيجابي (+)</option>
                                                        <option value="neutral">محايد (0)</option>
                                                        <option value="negative">سلبي (-)</option>
                                                    </select>
                                                    {domain.scales.length > 1 && (
                                                        <button onClick={() => removeScale(domain.id, scale.id)} className="text-red-400 hover:text-red-600 px-1 text-base hover:scale-110 transition-transform cursor-pointer">
                                                            <i className="fas fa-times-circle"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                
                                {/* Items Grid/Table Structure */}
                                <div className="w-full overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
                                    <div className="min-w-[1040px] md:min-w-[1300px]">
                                        {/* Table Header */}
                                        <div className="flex gap-1.5 bg-slate-100 p-1.5 md:p-2 rounded-t-xl font-bold text-gray-700 border-b border-gray-300 items-center">
                                            <div className="w-8"></div>
                                            <div className="flex-1 px-1 text-xs md:text-sm text-blue-900 drop-shadow-sm">البنود (Sub-items)</div>
                                            {domain.scales.map(scale => (
                                                <div key={scale.id} className={`w-24 text-center px-1 text-xs flex flex-col items-center justify-center
                                                    ${scale.type === 'positive' ? 'text-green-700' : 
                                                        scale.type === 'negative' ? 'text-red-700' : 
                                                            'text-gray-600'}`}
                                                >
                                                    <span className="font-bold truncate w-full drop-shadow-sm">{scale.name}</span>
                                                    {scale.type === 'positive' && <i className="fas fa-plus text-[10px] mt-0.5"></i>}
                                                    {scale.type === 'negative' && <i className="fas fa-minus text-[10px] mt-0.5"></i>}
                                                    {scale.type === 'neutral' && <i className="fas fa-circle text-[8px] mt-0.5 opacity-50"></i>}
                                                </div>
                                            ))}
                                            <div className="w-20 text-center font-bold text-xs text-blue-800 drop-shadow-sm">إجمالي الصف</div>
                                            <div className="w-20 text-center font-bold text-xs text-green-700 drop-shadow-sm">إيجابيات</div>
                                            <div className="w-12 text-center"></div>
                                        </div>
                                        
                                        {/* Items Rows */}
                                        <div className={`${domain.items.length > 0 ? '' : 'rounded-b-xl'} pb-1 bg-gray-50 space-y-1 p-1.5`}>
                                            {domain.items.map((item, iIndex) => {
                                                const isDraggedOver = draggedOverItem && draggedOverItem.domainId === domain.id && draggedOverItem.itemIndex === iIndex;
                                                const rowTotal = getItemRowTotal(item.values, domain.scales);
                                                const posTotal = getPositivesTotal(item.values, domain.scales);
                                                const isRowValid = Math.abs(rowTotal - 100) < 0.1;
                                                const hasValues = domain.scales.some(s => item.values[s.id] !== '' && Number(item.values[s.id]) > 0);
                                                const needsRedBorder = hasValues && !isRowValid;
                                                
                                                return (
                                                    <div 
                                                        key={item.id}
                                                        draggable
                                                        onDragStart={(e) => handleDragStart(e, domain.id, iIndex)}
                                                        onDragOver={(e) => handleDragOver(e, domain.id, iIndex)}
                                                        onDrop={(e) => handleDrop(e, domain.id, iIndex)}
                                                        onDragEnd={handleDragEnd}
                                                        className={`flex items-center gap-1.5 p-1.5 md:p-2 rounded-lg bg-white shadow-sm transition-all cursor-move hover:shadow-md
                                                            ${isDraggedOver ? 'border-dashed border-2 border-blue-400 bg-blue-50 scale-[1.01]' : ''}
                                                            ${needsRedBorder ? 'border-2 border-red-500 ring-2 ring-red-100' : 'border border-gray-200'}
                                                        `}
                                                    >
                                                        {/* Drag Handle */}
                                                        <div className="w-8 flex justify-center text-gray-400 hover:text-blue-600 transition-colors">
                                                            <i className="fas fa-grip-vertical text-xl"></i>
                                                        </div>
